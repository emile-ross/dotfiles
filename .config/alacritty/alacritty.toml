[window]
opacity = 0.55
decorations = "Full"
decorations_theme_variant = "Dark"

[font]
size = 13.0

[font.normal]
family = "JetBrainsMono Nerd Font"

[font.bold]
family = "JetBrainsMono Nerd Font"

[font.italic]
family = "JetBrainsMono Nerd Font"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"

[colors.primary]
background = "#000000"
foreground = "#CDD6F4"

[colors.cursor]
text = "#000000"
cursor = "#FFFFFF"

[colors.selection]
text = "CellForeground"
background = "#44475a"

[colors.normal]
black	 = "#1E1E2E"
red		 = "#F38BA8"
green	 = "#A6E3A1"
yellow	= "#F9E2AF"
blue		= "#89B4FA"
magenta = "#F5C2E7"
cyan		= "#94E2D5"
white	 = "#BAC2DE"

[colors.bright]
black	 = "#45475A"
red		 = "#F38BA8"
green	 = "#A6E3A1"
yellow	= "#F9E2AF"
blue		= "#89B4FA"
magenta = "#F5C2E7"
cyan		= "#94E2D5"
white	 = "#CDD6F4"

[scrolling]
history = 10000
multiplier = 3

[keyboard]
bindings = [
	{ key = "V", mods = "Control|Shift", action = "Paste" },
	{ key = "C", mods = "Control|Shift", action = "Copy" },
	{ key = "N", mods = "Control|Shift", action = "SpawnNewInstance" }
]

[env]
TERM = "xterm-256color"
